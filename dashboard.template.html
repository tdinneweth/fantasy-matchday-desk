<title>Fantasy Matchday Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    color-scheme: light;
    --rail: #0a0a0b;
    --rail-btn: #26272a;
    --rail-ink: #b9bcc2;
    --rail-on: #ffffff;
    --rail-on-ink: #0a0a0b;
    --sheet-1: #d6e9f7;
    --sheet-2: #e6f0ee;
    --sheet-3: #edf1e9;
    --surface: #ffffff;
    --soft: rgba(255, 255, 255, .58);
    --field: rgba(255, 255, 255, .8);
    --ink: #0e1013;
    --ink-2: #5b6169;
    --ink-3: #8e939a;
    --line: #e6e9eb;
    --line-2: #eff1f2;
    --mint: #e4f4e2;
    --mint-ink: #2c6a45;
    --sky: #e1eef9;
    --sky-ink: #285f93;
    --chart: #f1f0ea;
    --green: #2c7a4d;
    --blue: #2a6db0;
    --live: #ef5a1f;
    --live-soft: #fde6da;
    --up: #1d8a4a;
    --down: #c8392f;
    --yc: #f2b705;
    --rc: #d93a2f;
    --tip: #0e1013;
    --tip-ink: #ffffff;
    --pitch-1: #7fb58a;
    --pitch-2: #76ad82;
    --pitch-line: rgba(255, 255, 255, .55);
    /* one colour per team, used everywhere that team appears; validated as a
       categorical set (dataviz palette, slots 1-4) */
    --t1: #2a78d6;
    --t2: #eb6834;
    --t3: #1baf7a;
    --t4: #eda100;
    --shadow: 0 1px 2px rgba(16, 24, 32, .04), 0 12px 32px -20px rgba(16, 24, 32, .28);
    --lift: 0 8px 24px -10px rgba(16, 24, 32, .25);
    --r-xl: 28px;
    --r-lg: 22px;
    --r-md: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --rail: #000000;
      --rail-btn: #1c1d20;
      --rail-ink: #9ea2a9;
      --rail-on: #f3f4f5;
      --rail-on-ink: #000000;
      --sheet-1: #0f1922;
      --sheet-2: #101816;
      --sheet-3: #121612;
      --surface: #161b1f;
      --soft: rgba(255, 255, 255, .035);
      --field: rgba(255, 255, 255, .06);
      --ink: #eef1f3;
      --ink-2: #a3a9b1;
      --ink-3: #6f757d;
      --line: #263036;
      --line-2: #1e252a;
      --mint: #132419;
      --mint-ink: #7dd3a0;
      --sky: #10212f;
      --sky-ink: #86bdf0;
      --chart: #1c201e;
      --green: #62c98d;
      --blue: #6aaef0;
      --live: #ff6a35;
      --live-soft: #3a1c10;
      --up: #4cc47c;
      --down: #ff7d70;
      --tip: #f3f4f5;
      --tip-ink: #0e1013;
      --pitch-1: #22442c;
      --pitch-2: #1f3f29;
      --pitch-line: rgba(255, 255, 255, .22);
      --t1: #3987e5;
      --t2: #d95926;
      --t3: #199e70;
      --t4: #c98500;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8);
      --lift: 0 8px 24px -10px rgba(0, 0, 0, .7);
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --rail: #000000;
    --rail-btn: #1c1d20;
    --rail-ink: #9ea2a9;
    --rail-on: #f3f4f5;
    --rail-on-ink: #000000;
    --sheet-1: #0f1922;
    --sheet-2: #101816;
    --sheet-3: #121612;
    --surface: #161b1f;
    --soft: rgba(255, 255, 255, .035);
    --field: rgba(255, 255, 255, .06);
    --ink: #eef1f3;
    --ink-2: #a3a9b1;
    --ink-3: #6f757d;
    --line: #263036;
    --line-2: #1e252a;
    --mint: #132419;
    --mint-ink: #7dd3a0;
    --sky: #10212f;
    --sky-ink: #86bdf0;
    --chart: #1c201e;
    --green: #62c98d;
    --blue: #6aaef0;
    --live: #ff6a35;
    --live-soft: #3a1c10;
    --up: #4cc47c;
    --down: #ff7d70;
    --tip: #f3f4f5;
    --tip-ink: #0e1013;
    --pitch-1: #22442c;
    --pitch-2: #1f3f29;
    --pitch-line: rgba(255, 255, 255, .22);
    --t1: #3987e5;
    --t2: #d95926;
    --t3: #199e70;
    --t4: #c98500;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 32px -18px rgba(0, 0, 0, .8);
    --lift: 0 8px 24px -10px rgba(0, 0, 0, .7);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--rail);
    color: var(--ink);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14.5px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }

  button { font: inherit; color: inherit; }
  svg.i { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7;
          stroke-linecap: round; stroke-linejoin: round; display: block; }

  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* ---------- shell: black rail, rounded sheet ---------- */

  .app {
    display: grid;
    grid-template-columns: 88px minmax(0, 1fr);
    min-height: 100vh;
  }

  .rail {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 26px 0;
    z-index: 5;
  }

  .logo {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    margin-bottom: 22px;
    color: #fff;
  }

  .logo svg { width: 40px; height: 40px; }

  .rail-items { display: flex; flex-direction: column; gap: 14px; align-items: center; }

  .rb {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 0;
    background: var(--rail-btn);
    color: var(--rail-ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .02em;
    transition: background .15s, color .15s, transform .15s;
  }

  .rb:hover { color: #fff; transform: translateY(-1px); }
  .rb[aria-current="true"] { background: var(--rail-on); color: var(--rail-on-ink); }

  /* a team's own colour, as a ring segment under the monogram */
  .rb .tdot {
    position: absolute;
    right: 1px;
    bottom: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--tc);
    border: 2px solid var(--rail);
  }

  .rb .ldot {
    position: absolute;
    right: 0;
    top: 0;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--live);
    border: 2px solid var(--rail);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .rb .tip-r {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    white-space: nowrap;
    background: var(--rail-on);
    color: var(--rail-on-ink);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s;
  }

  .rb:hover .tip-r, .rb:focus-visible .tip-r { opacity: 1; }

  .rail-sep { width: 28px; height: 1px; background: var(--rail-btn); margin: 2px 0; }

  .sheet {
    min-width: 0;
    border-radius: 34px 0 0 34px;
    background:
      radial-gradient(1200px 520px at 0% 0%, var(--sheet-1), transparent 70%),
      linear-gradient(160deg, var(--sheet-2) 0%, var(--sheet-3) 100%);
    background-color: var(--sheet-3);
    padding: 26px 40px 36px;
  }

  .inner { max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- top bar ---------- */

  .topbar {
    display: grid;
    grid-template-columns: minmax(200px, 300px) 1fr auto;
    align-items: center;
    gap: 16px;
  }

  .search { position: relative; }

  .field {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 46px;
    padding: 0 16px;
    border-radius: 14px;
    background: var(--field);
    color: var(--ink-3);
    border: 1px solid transparent;
  }

  .field:focus-within { border-color: var(--line); background: var(--surface); }

  .field input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font: inherit;
    font-size: 14.5px;
    color: var(--ink);
  }

  .field input::placeholder { color: var(--ink-3); }

  .field kbd {
    font: inherit;
    font-size: 11px;
    color: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 0 6px;
  }

  .results {
    position: absolute;
    top: 52px;
    left: 0;
    width: min(420px, 92vw);
    background: var(--surface);
    border-radius: var(--r-md);
    box-shadow: var(--lift);
    border: 1px solid var(--line);
    padding: 6px;
    z-index: 20;
  }

  .results .none { padding: 12px; color: var(--ink-2); font-size: 13px; margin: 0; }

  .status-c { display: flex; justify-content: center; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-2);
  }

  .status b { color: var(--ink); font-weight: 600; }
  .status.is-live { color: var(--live); }
  .status.is-live b { color: var(--live); }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
  .status.is-live .dot { animation: pulse 1.6s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .35; transform: scale(.7); }
  }

  .actions { display: flex; align-items: center; gap: 10px; }

  .ib {
    position: relative;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .ib:hover { background: var(--field); }

  .ib .count {
    position: absolute;
    top: 6px;
    left: 6px;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    border-radius: 9px;
    background: var(--live);
    color: #fff;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 17px;
    text-align: center;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(140deg, #f6c46b, #e0884b);
    color: #3a1d06;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 14px;
    border: 2px solid var(--surface);
  }

  /* ---------- hero ---------- */

  .hero {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .hero-l { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .crest-xl {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    flex: none;
    display: grid;
    place-items: center;
    background: var(--surface);
    box-shadow: inset 0 0 0 3px var(--tc, var(--ink));
    color: var(--ink);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .01em;
  }

  .crest-xl svg { width: 32px; height: 32px; }

  .hero h1 {
    margin: 0;
    font-size: clamp(30px, 4.2vw, 50px);
    font-weight: 600;
    letter-spacing: -.025em;
    line-height: 1.02;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hero-name { display: flex; align-items: center; gap: 12px; min-width: 0; }

  .picker { position: relative; }

  .chev {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 0;
    background: var(--field);
    display: grid;
    place-items: center;
    cursor: pointer;
    flex: none;
  }

  .chev:hover { background: var(--surface); }

  .menu {
    position: absolute;
    top: 50px;
    left: 0;
    min-width: 240px;
    background: var(--surface);
    border-radius: var(--r-md);
    box-shadow: var(--lift);
    border: 1px solid var(--line);
    padding: 6px;
    z-index: 20;
  }

  .menu button {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 10px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
  }

  .menu button:hover, .menu button[aria-current="true"] { background: var(--line-2); }
  .menu .lg { margin-left: auto; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }

  .mono {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex: none;
    display: grid;
    place-items: center;
    font-size: 10.5px;
    font-weight: 800;
    color: #fff;
    background: var(--tc, var(--ink-3));
  }

  .hero-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

  .tag {
    font-size: 11.5px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--field);
    color: var(--ink-2);
    white-space: nowrap;
  }

  .tag.hot { background: var(--live-soft); color: var(--live); }

  .hero-r { display: flex; align-items: center; gap: 14px; }

  .icon-chip {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--field);
    display: grid;
    place-items: center;
    flex: none;
  }

  .big {
    font-size: clamp(34px, 4.4vw, 54px);
    font-weight: 600;
    letter-spacing: -.03em;
    line-height: 1;
  }

  .big small {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0;
    color: var(--ink-2);
    margin-top: 6px;
    text-align: right;
  }

  /* ---------- stat row ---------- */

  .stats {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px 24px;
    flex-wrap: wrap;
  }

  .stat-list { display: flex; flex-wrap: wrap; gap: 14px 34px; }

  .stat { display: flex; align-items: center; gap: 10px; }
  .stat .i { color: var(--ink-3); width: 22px; height: 22px; }
  .stat .v { font-size: 25px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .stat .k { display: block; font-size: 11.5px; font-weight: 500; color: var(--ink-3); letter-spacing: .01em; }
  .stat.c-green .v { color: var(--green); }
  .stat.c-blue .v { color: var(--blue); }
  .stat.c-green .i { color: var(--green); }
  .stat.c-blue .i { color: var(--blue); }

  .mv { font-size: 12px; font-weight: 700; margin-left: 4px; letter-spacing: 0; }
  .mv.up { color: var(--up); }
  .mv.down { color: var(--down); }
  .mv.flat { color: var(--ink-3); font-weight: 500; }

  .pill {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: 14px;
    background: var(--field);
    font-size: 13.5px;
    color: var(--ink-2);
  }

  .pill b { color: var(--ink); font-weight: 700; }
  .pill .i { color: var(--ink-2); }
  .pill .when { color: var(--live); font-weight: 700; }

  /* ---------- team cards (overview) ---------- */

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border-radius: var(--r-lg);
    padding: 18px 18px 16px;
    box-shadow: var(--shadow);
    border: 0;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 12px;
    transition: transform .15s, box-shadow .15s;
  }

  .card:hover { transform: translateY(-2px); box-shadow: var(--lift); }

  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card-id { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .card-id b { display: block; font-size: 15.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-id .lg { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; }
  .card .mono { width: 36px; height: 36px; font-size: 12px; }

  .card .pts { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1; text-align: right; }
  .card .pts small { display: block; font-size: 11px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; margin-top: 4px; }
  .card .pts.none { color: var(--ink-3); }

  .bar { display: flex; gap: 3px; height: 5px; }
  .bar i { display: block; border-radius: 3px; }
  .bar .done { background: var(--ink-3); opacity: .55; }
  .bar .now { background: var(--live); }
  .bar .todo { background: var(--line); }

  .card-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
  .card-foot .k { font-size: 11px; color: var(--ink-3); font-weight: 500; display: block; }
  .card-foot .v { font-size: 15px; font-weight: 700; }
  .spark { width: 96px; height: 34px; flex: none; }

  .card .live-n {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* ---------- the two-column board ---------- */

  .board {
    display: grid;
    grid-template-columns: minmax(300px, 400px) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }

  .panel {
    border-radius: var(--r-xl);
    min-width: 0;
  }

  .side {
    background: var(--soft);
    border: 1px solid rgba(255, 255, 255, .5);
    padding: 22px 16px 12px;
    backdrop-filter: blur(6px);
  }

  :root[data-theme="dark"] .side { border-color: var(--line-2); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .side { border-color: var(--line-2); } }

  .main { background: var(--surface); padding: 22px 26px 26px; box-shadow: var(--shadow); }

  .p-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 6px 14px;
  }

  .p-head h2 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.015em; }
  .p-head .meta { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .p-head .meta .i { color: var(--ink-3); }

  .seg { display: flex; gap: 4px; padding: 0 2px 12px; flex-wrap: wrap; }

  .seg button {
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-weight: 600;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
  }

  .seg button:hover { background: var(--field); color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  .seg button .n { opacity: .6; margin-left: 3px; }

  .side .field { margin: 0 2px 14px; background: var(--field); height: 44px; }

  .list { display: flex; flex-direction: column; max-height: 960px; overflow-y: auto; padding: 0 2px; }

  .grp {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-3);
    padding: 12px 14px 6px;
    display: flex;
    justify-content: space-between;
  }

  .prow {
    display: grid;
    grid-template-columns: 44px minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;
    padding: 9px 14px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    text-align: left;
    cursor: pointer;
    width: 100%;
    transition: background .12s, box-shadow .12s;
  }

  .prow:hover, .prow:focus-visible { background: var(--surface); box-shadow: var(--lift); }
  .prow.benched { opacity: .62; }
  .prow.live { background: color-mix(in srgb, var(--live-soft) 75%, transparent); }

  .prow .nm { display: block; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .ln { display: block; font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
  .prow .ln .lv { color: var(--live); font-weight: 700; }
  .prow .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .prow .p { font-size: 17px; font-weight: 700; }
  .prow .p.zero { color: var(--ink-3); font-weight: 600; }

  .face {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    object-position: top center;
    background-color: var(--line-2);
    display: block;

        <rect x="1.5" y="1.5" width="37" height="37" rx="11" stroke="currentColor" stroke-width="2.2"/>
        <path d="M20 2v36" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="8" stroke="currentColor" stroke-width="2.2"/>
        <circle cx="20" cy="20" r="3.6" fill="#ef5a1f"/>

  <main class="sheet">
    <div class="inner">
      <header class="topbar">

            <svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            <span class="count" id="bellcount" hidden></span>

          <span class="avatar" id="avatar" title="">TD</span>

      </header>

      <section class="hero" id="hero"></section>

      <div class="board">
        <section class="panel side" aria-labelledby="sidetitle">

          <div class="seg" id="sideseg"></div>
          <label class="field" id="sidesearch">
            <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="sq" type="search" placeholder="Search" autocomplete="off" aria-label="Filter the squad">
          </label>

        <section class="panel main">

            <div class="tablist" role="tablist" id="tabs"></div>
