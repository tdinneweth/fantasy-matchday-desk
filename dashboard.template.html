</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-label="Player"></aside>

<script>
  var SNAPSHOT = /*__SNAPSHOT__*/ null;
  var PHOTOS = /*__PHOTOS__*/ {};
  var BADGES = /*__BADGES__*/ {};
  var DATA_URL = /*__DATA_URL__*/ "";
  /* the hosted page may load portraits straight from the games' own image hosts;
     the artifact runtime's CSP blocks that, so its build inlines them instead */
  var REMOTE = /*__REMOTE__*/ false;

  var FPL_PHOTO = "https://resources.premierleague.com/premierleague/photos/players/110x140/p";
  var FPL_PHOTO_ALT = "https://resources.premierleague.com/premierleague25/photos/players/110x140/";
  var FPL_BADGE = "https://resources.premierleague.com/premierleague/badges/70/t";
  var PRO_BADGE = "https://fanarena.s3.eu-west-1.amazonaws.com/badges/club_";

  var state = SNAPSHOT;
  var sel = null;            // team index, null = all four
  var tab = "round";
  var sideMode = null;       // overview list: live | todo | top, null = pick for me
  var fxMode = null;         // team results panel: played | next, null = pick for me
  var rankMode = null;       // overall | week
  var showSeen = false;
  var squadQuery = "";
  var openFx = {};
  var drawerKey = null;

  var el = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
    } catch (e) { /* private window, or storage refused: the page still works */ }
    return null;
  }

  /* which ticker entries this viewer has ticked off, kept in their own browser */
  var SEEN_KEY = "fmd.seen";
  var seenList = (function () { try { return JSON.parse(store(SEEN_KEY) || "[]"); } catch (e) { return []; } })();
  var seenSet = {};
  seenList.forEach(function (id) { seenSet[id] = true; });

  function markSeen(ids) {
    ids.forEach(function (id) {
      if (id && !seenSet[id]) { seenSet[id] = true; seenList.push(id); }
    });
    store(SEEN_KEY, JSON.stringify(seenList.slice(-300)));
    render();
  }

  /* ---------- icons ---------- */

  var ICON = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>',
    chev: '<path d="m6 9 6 6 6-6"/>',
    cal: '<rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
    wallet: '<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3h-4a2 2 0 0 0 0 4h4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/>',
    star: '<path d="M12 2.8l2.85 5.78 6.37.93-4.61 4.49 1.09 6.35L12 17.35l-5.7 3 1.09-6.35-4.61-4.49 6.37-.93z"/>',
    trophy: '<path d="M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8M9 18h6"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
    pulse: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    swap: '<path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>',
    moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
    auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    shirt: '<path d="M20.4 3.5 16 2a4 4 0 0 1-8 0L3.6 3.5a2 2 0 0 0-1.3 2.2l.6 3.5a1 1 0 0 0 1 .8H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.1a1 1 0 0 0 1-.8l.6-3.5a2 2 0 0 0-1.3-2.2z"/>'
  };

  function icon(name, cls) {
    return '<svg class="i' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" aria-hidden="true">' + ICON[name] + '</svg>';
  }

  var LOGO = el("app").querySelector(".logo svg").outerHTML;

  /* ---------- formatting ---------- */

  function num(v) { return v == null ? "–" : Number(v).toLocaleString("en-GB"); }

  function brief(v) {
    if (v == null) return "–";
    var n = Number(v);
    if (n >= 1e6) return (n / 1e6).toFixed(n < 1e7 ? 2 : 1) + "M";
    if (n >= 1e4) return Math.round(n / 1e3) + "k";
    if (n >= 1e3) return (n / 1e3).toFixed(1) + "k";
    return String(n);
  }

  /* a phone gets the short form, everything else the exact figure */
  function both(v) {
    return '<span class="wide">' + num(v) + '</span><span class="narrow">' + brief(v) + '</span>';
  }

  function money(v) { return v == null ? "–" : "£" + Number(v).toFixed(1) + "m"; }

  function signed(v) { return (v > 0 ? "+" : "") + v; }

  function ago(iso) {
    if (!iso) return "never";
    var secs = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
    if (secs < 60) return secs + " sec ago";
    if (secs < 3600) return Math.round(secs / 60) + " min ago";
    if (secs < 86400) return Math.round(secs / 3600) + " hr ago";
    var d = Math.round(secs / 86400);
    return d + (d === 1 ? " day ago" : " days ago");
  }

  function until(iso) {
    var secs = Math.round((new Date(iso).getTime() - Date.now()) / 1000);
    if (secs <= 0) return "now";
    var d = Math.floor(secs / 86400), h = Math.floor(secs % 86400 / 3600), m = Math.floor(secs % 3600 / 60);
    if (d) return "in " + d + "d " + h + "h";
    if (h) return "in " + h + "h " + m + "m";
    return "in " + m + "m";
  }

  function hhmm(iso) {
    return iso ? new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
  }

  function dayTime(iso) {
    if (!iso) return "";
    return new Date(iso).toLocaleDateString("en-GB", { weekday: "short" }) + " " + hhmm(iso);
  }

  function dayLong(iso) {
    return new Date(iso).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" });
  }

  function initials(name) {
    return String(name || "?").replace(/[^A-Za-zÀ-ÿ\- ]/g, "").split(/[ \-]/)
      .filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase() || "?";
  }

  /* ---------- data access ---------- */

  function allTeams(s) {
    var out = [];
    if (s && s.fpl && s.fpl.teams) out = out.concat(s.fpl.teams);
    if (s && s.pro && s.pro.teams) out = out.concat(s.pro.teams);
    return out;
  }

  function teamIndex(name) {
    var teams = allTeams(state);
    for (var i = 0; i < teams.length; i++) if (teams[i].name === name) return i;
    return -1;
  }

  function tc(i) { return "var(--t" + ((i < 0 ? 0 : i) % 4 + 1) + ")"; }
  function slug(t) { return String(t.name).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, ""); }
  function league(game) { return game === "FPL" ? "Premier League" : "Pro League"; }
  function roundName(game) {
    if (game === "FPL") return "GW " + ((state && state.fpl && state.fpl.gw) || "");
    return "week " + ((state && state.pro && state.pro.week) || "");
  }
  function pkey(game, p) { return game + "|" + p.name + "|" + p.club; }
  function shown(p) { return p.multiplier > 1 ? (p.points || 0) * p.multiplier : (p.points || 0); }

  /* every player across the four squads, once, with who owns them */
  function players(onlyTeam) {
    var byKey = {}, out = [];
    allTeams(state).forEach(function (t, i) {
      if (onlyTeam != null && i !== onlyTeam) return;
      (t.squad || []).forEach(function (p) {
        var k = pkey(t.game, p);
        if (!byKey[k]) {
          byKey[k] = { key: k, game: t.game, p: p, owners: [] };
          out.push(byKey[k]);
        }
        byKey[k].owners.push({ i: i, team: t.name, captain: p.captain, vice: p.vice,
                               bench: p.bench, multiplier: p.multiplier });
      });
    });
    return out;
  }

  function findPlayer(key) {
    var all = players(null);
    for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
    return null;
  }

  /* ---------- images ---------- */

  var BAD = {};

  function photoSrc(p) {
    if (!p || !p.photo) return null;
    if (PHOTOS[p.photo]) return PHOTOS[p.photo];
    if (!REMOTE) return null;
    if (p.photo.indexOf("fpl-") === 0) {
      var code = p.photo.slice(4, -4);
      var first = FPL_PHOTO + code + ".png";
      return BAD[first] ? FPL_PHOTO_ALT + code + ".png" : first;
    }
    return p.photoSource || null;
  }

  function face(p, cls) {
    var src = photoSrc(p);
    var ini = esc(initials(p && p.name));
    var c = "face" + (cls ? " " + cls : "");
    if (!src || BAD[src]) return '<span class="' + c + ' ini">' + ini + '</span>';
    if (p.photo.indexOf("pro-") === 0) {
      // Pro League portraits are loose 250px squares with the head small in the
      // middle; framed as-is a small circle shows only white. Zoom onto the head.
      return '<span class="' + c + ' pro" style="background-image:url(&quot;' + esc(src) + '&quot;)" aria-hidden="true"></span>';
    }
    var alt = (REMOTE && p.photo.indexOf("fpl-") === 0 && src.indexOf(FPL_PHOTO) === 0)
      ? FPL_PHOTO_ALT + p.photo.slice(4, -4) + ".png" : "";
    return '<img class="' + c + '" src="' + esc(src) + '" alt="" loading="lazy" data-ini="' + ini + '"' +
      (alt ? ' data-alt="' + esc(alt) + '"' : "") + '>';
  }

  function crestSrc(file) {
    if (!file) return null;
    if (BADGES[file]) return BADGES[file];
    if (!REMOTE) return null;
    var id = file.replace(/^.*-club-/, "").replace(/\.png$/, "");
    return file.indexOf("fpl-") === 0 ? FPL_BADGE + id + ".png" : PRO_BADGE + id + ".png";
  }

  function crest(file, club, cls) {
    var src = crestSrc(file);
    return src
      ? '<img class="crest' + (cls ? " " + cls : "") + '" src="' + esc(src) + '" alt="" title="' + esc(club) + '" loading="lazy">'
      : '<span class="crest' + (cls ? " " + cls : "") + '"></span>';
  }

  /* one listener instead of inline onerror handlers, which the artifact CSP drops */
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (!img || img.tagName !== "IMG") return;
    BAD[img.getAttribute("src")] = true;
    if (img.dataset.alt) {
      var a = img.dataset.alt;
      img.removeAttribute("data-alt");
      img.src = a;
      return;
    }
    if (img.classList.contains("crest")) { img.style.visibility = "hidden"; return; }
    var s = document.createElement("span");
    s.className = img.className + " ini";
    s.textContent = img.dataset.ini || "?";
    img.replaceWith(s);
  }, true);

  /* ---------- small pieces ---------- */

  function ownersHtml(owners) {
    return '<span class="owners">' + owners.map(function (o) {
      return '<span class="own' + (o.bench ? " bench" : "") + '" style="--tc:' + tc(o.i) + '" title="' +
        esc(o.team + (o.captain ? " · captain" : "") + (o.vice ? " · vice" : "") + (o.bench ? " · bench" : "")) + '">' +
        esc(initials(o.team)) + (o.captain ? "·C" : "") + '</span>';
    }).join("") + '</span>';
  }

  function moveHtml(m) {
    if (!m || !m.delta) return "";
    var up = m.delta > 0;
    return '<span class="mv ' + (up ? "up" : "down") + '" title="' + esc((up ? "Up " : "Down ") +
      num(Math.abs(m.delta)) + " since " + m.basis) + '">' + (up ? "▲ " : "▼ ") + brief(Math.abs(m.delta)) + '</span>';
  }

  function subLine(p) {
    var bits = [esc(p.club)];
    if (p.opponent) bits.push(esc(p.opponent));
    if (p.state === "live") {
      bits.push('<span class="lv">' + esc(p.score || "") + " " +
        (p.matchMinute != null ? p.matchMinute + "'" : "live") + '</span>');
    } else if (p.state === "done") {
      if (p.score) bits.push(esc(p.score));
      if (!p.minutes) bits.push("didn't play");
    } else if (p.kickoff) {
      bits.push(esc(dayTime(p.kickoff)));
    }
    return bits.join(" · ");
  }

  function eventChips(p) {
    var ev = [];
    if (p.goals) ev.push('<span class="ev g">' + p.goals + (p.goals > 1 ? " goals" : " goal") + '</span>');
    if (p.assists) ev.push('<span class="ev">' + p.assists + (p.assists > 1 ? " assists" : " assist") + '</span>');
    if (p.cleanSheet) ev.push('<span class="ev">clean sheet</span>');
    if (p.bonus) ev.push('<span class="ev">+' + p.bonus + ' bonus</span>');
    if (p.red) ev.push('<span class="ev rc">red card</span>');
    else if (p.yellow) ev.push('<span class="ev yc">yellow card</span>');
    return ev.join("");
  }

  function emptyP(text) { return '<p class="empty">' + text + '</p>'; }

  /* ---------- rail ---------- */

  function renderRail(teams) {
    var html = '<button class="rb" data-team="" aria-current="' + (sel == null) + '" aria-label="All teams">' +
      icon("grid") + '<span class="tip-r">All teams</span></button><span class="rail-sep"></span>';
    html += teams.map(function (t, i) {
      var live = (t.playersLive || 0) > 0;
      return '<button class="rb" data-team="' + i + '" aria-current="' + (sel === i) + '" aria-label="' + esc(t.name) +
        '" style="--tc:' + tc(i) + '">' + esc(initials(t.name)) + '<span class="tdot"></span>' +
        (live ? '<span class="ldot"></span>' : "") +
        '<span class="tip-r">' + esc(t.name) + ' · ' + league(t.game) + '</span></button>';
    }).join("");
    el("rail").innerHTML = html;
  }

  /* ---------- hero ---------- */

  function nextDeadline(game) {
    var c = [];
    var s = state || {};
    if (s.fpl && s.fpl.next && (!game || game === "FPL")) c.push({ label: "GW " + s.fpl.next.gw, game: "FPL", at: s.fpl.next.deadline });
    if (s.pro && s.pro.next && (!game || game === "PRO")) c.push({ label: "Pro League week " + s.pro.next.week, game: "PRO", at: s.pro.next.deadline });
    c = c.filter(function (d) { return d.at && new Date(d.at).getTime() > Date.now(); });
    c.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    return c[0] || null;
  }

  function pickerHtml(teams) {
    return '<div class="menu" id="menu" hidden>' +
      '<button data-team="" aria-current="' + (sel == null) + '"><span class="mono" style="--tc:var(--ink)">' +
      icon("grid").replace('class="i"', 'class="i" style="width:14px;height:14px"') + '</span>All teams</button>' +
      teams.map(function (t, i) {
        return '<button data-team="' + i + '" aria-current="' + (sel === i) + '"><span class="mono" style="--tc:' + tc(i) + '">' +
          esc(initials(t.name)) + '</span>' + esc(t.name) + '<span class="lg">' + (t.game === "FPL" ? "FPL" : "Pro League") + '</span></button>';
      }).join("") + '</div>';
  }

  function renderHero(teams) {
    var t = sel == null ? null : teams[sel];
    var left, right;

    if (!t) {
      var total = teams.reduce(function (a, x) { return a + (x.gwPoints || 0); }, 0);
      left = '<span class="crest-xl" style="--tc:var(--ink)">' + LOGO + '</span>' +
        '<div><div class="hero-name"><h1>Matchday</h1><div class="picker"><button class="chev" id="pick" aria-label="Choose a team" aria-haspopup="true">' +
        icon("chev") + '</button>' + pickerHtml(teams) + '</div></div>' +
        '<div class="hero-tags"><span class="tag">' + teams.length + ' teams</span>' +
        (state && state.fpl ? '<span class="tag">Premier League GW ' + state.fpl.gw + '</span>' : "") +
        (state && state.pro ? '<span class="tag">Pro League week ' + state.pro.week + '</span>' : "") + '</div></div>';
      right = '<span class="icon-chip">' + icon("star") + '</span><div class="big">' + num(total) +
        '<small>points this round, all four teams</small></div>';
    } else {
      var tags = ['<span class="tag">' + league(t.game) + ' · ' + roundName(t.game) + '</span>'];
      if (t.chip) tags.push('<span class="tag hot">' + esc(t.chip) + '</span>');
      if (t.hit) tags.push('<span class="tag hot">−' + t.hit + ' hit</span>');
      if (t.playersLive) tags.push('<span class="tag hot">' + t.playersLive + ' on the pitch</span>');
      else if (t.playersLeft) tags.push('<span class="tag">' + t.playersLeft + ' still to play</span>');
      else if (!t.unavailable) tags.push('<span class="tag">all played</span>');
      if (t.autoSubs) tags.push('<span class="tag">' + t.autoSubs + ' auto-sub' + (t.autoSubs > 1 ? "s" : "") + '</span>');
      if (t.manager) el("avatar").title = t.manager;

      left = '<span class="crest-xl" style="--tc:' + tc(sel) + '">' + esc(initials(t.name)) + '</span>' +
        '<div style="min-width:0"><div class="hero-name"><h1>' + esc(t.name) + '</h1><div class="picker"><button class="chev" id="pick" aria-label="Choose a team" aria-haspopup="true">' +
        icon("chev") + '</button>' + pickerHtml(teams) + '</div></div>' +
        '<div class="hero-tags">' + tags.join("") + '</div></div>';
      right = '<span class="icon-chip">' + icon("star") + '</span><div class="big">' +
        (t.gwPoints == null ? "–" : num(t.gwPoints)) + '<small>points · ' + esc(roundName(t.game)) + '</small></div>';
    }
    el("hero").innerHTML = '<div class="hero-l">' + left + '</div><div class="hero-r">' + right + '</div>';
  }

  function stat(cls, ic, value, label) {
    return '<div class="stat ' + cls + '">' + icon(ic) + '<div><span class="v">' + value + '</span><span class="k">' + label + '</span></div></div>';
  }

  function renderStats(teams) {
    var t = sel == null ? null : teams[sel];
    var list;
    if (!t) {
      var live = players(null).filter(function (x) { return x.p.state === "live" && x.owners.some(function (o) { return !o.bench; }); }).length;
      var todo = players(null).filter(function (x) { return x.p.state === "upcoming" && x.owners.some(function (o) { return !o.bench; }); }).length;
      var unseen = tickerRows(null).filter(function (e) { return !seenSet[e.id]; });
      var swing = unseen.reduce(function (a, e) { return a + (e.points || 0); }, 0);
      list = stat("", "pulse", num(live), "on the pitch now") +
        stat("c-green", "clock", num(todo), "still to play") +
        stat("c-blue", "trend", unseen.length + (swing ? ' <span class="mv ' + (swing > 0 ? "up" : "down") + '">' + signed(swing) + ' pts</span>' : ""),
             "new point events");
    } else {
      list = stat("", "wallet", money(t.value) , "team value" + (t.bank != null ? " · " + money(t.bank) + " in the bank" : "")) +
        stat("c-green", "star", num(t.totalPoints), "season points") +
        stat("c-blue", "trophy", both(t.overallRank) + moveHtml(t.overallMove), "overall rank") +
        stat("", "trend", both(t.gwRank) + moveHtml(t.weekMove), roundName(t.game) + " rank");
    }

    var d = nextDeadline(t ? t.game : null);
    var pill = d
      ? '<div class="pill">' + icon("cal") + '<span>Next deadline · <b>' + esc(d.label) + '</b> · ' + esc(dayTime(d.at)) +
        ' <span class="when">' + esc(until(d.at)) + '</span></span></div>'
      : "";
    el("stats").innerHTML = '<div class="stat-list">' + list + '</div>' + pill;
  }

  /* ---------- overview cards ---------- */

  function sparkline(values, color) {
    var pts = values.filter(function (v) { return v != null; });
    if (pts.length < 2) return "";
    var w = 96, h = 34, lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
    if (hi === lo) { hi += 1; lo -= 1; }
    var step = w / (values.length - 1), d = "";
    values.forEach(function (v, i) {
      if (v == null) return;
      d += (d ? "L" : "M") + (i * step).toFixed(1) + " " + (h - 3 - (v - lo) / (hi - lo) * (h - 6)).toFixed(1);
    });
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>';
  }

  function renderCards(teams) {
    var box = el("cards");
    if (sel != null) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = teams.map(function (t, i) {
      var live = t.playersLive || 0, done = t.playersPlayed || 0, todo = t.playersLeft || 0;
      var total = Math.max(1, done + live + todo);
      var hist = (t.history || []).map(function (r) { return r.pts; });
      return '<button class="card" data-team="' + i + '" style="--tc:' + tc(i) + '" aria-label="Open ' + esc(t.name) + '">' +
        '<div class="card-top"><div class="card-id"><span class="mono">' + esc(initials(t.name)) + '</span>' +
          '<span style="min-width:0"><b>' + esc(t.name) + '</b><span class="lg">' + league(t.game) + '</span></span></div>' +
          '<div class="pts' + (t.gwPoints == null ? " none" : "") + '">' + (t.gwPoints == null ? "–" : t.gwPoints) +
          '<small>' + esc(roundName(t.game)) + '</small></div></div>' +
        '<div class="bar" aria-label="' + done + ' played, ' + live + ' playing, ' + todo + ' to play">' +
          '<i class="done" style="flex:' + done + '"></i><i class="now" style="flex:' + live + '"></i>' +
          '<i class="todo" style="flex:' + (total - done - live) + '"></i></div>' +
        '<div class="card-foot"><div><span class="k">Overall rank</span><span class="v">' + both(t.overallRank) +
          moveHtml(t.overallMove) + '</span></div>' + sparkline(hist, tc(i)) + '</div>' +
      '</button>';
    }).join("");
  }

  /* ---------- side panel ---------- */

  function prowHtml(x, opts) {
    var p = x.p;
    var o = x.owners[0] || {};
    var band = opts.team ? (o.captain ? '<span class="band">C</span>' : (o.vice ? '<span class="band">V</span>' : "")) : "";
    var pts = opts.team ? shown(Object.assign({}, p, { multiplier: o.multiplier })) : (p.points || 0);
    return '<button class="prow' + (p.state === "live" ? " live" : "") + (opts.team && o.bench ? " benched" : "") +
      '" data-p="' + esc(x.key) + '">' + face(p) +
      '<span style="min-width:0"><span class="nm">' + esc(p.name) + band + '</span><span class="ln">' + subLine(p) + '</span></span>' +
      '<span class="right"><span class="p' + (pts ? "" : " zero") + '">' + pts + '</span>' +
      (opts.team ? "" : ownersHtml(x.owners)) + '</span></button>';
  }

  var POSN = { GK: "Goalkeepers", DEF: "Defenders", MID: "Midfielders", FWD: "Forwards" };

  function renderSide(teams) {
    var t = sel == null ? null : teams[sel];
    var body = el("sidebody");

    if (t) {
      el("sidetitle").textContent = "Squad";
      el("sidemeta").innerHTML = t.gwPoints == null ? "" : num(t.gwPoints) + " pts";
      el("sideseg").hidden = true;
      el("sidesearch").hidden = false;
      if (t.unavailable) {
        body.innerHTML = emptyP("Fantasy Pro League needs a signed-in session before it will hand over " + esc(t.name) + "&rsquo;s squad.");
        return;
      }
      var q = squadQuery.trim().toLowerCase();
      var rows = players(sel).filter(function (x) {
        return !q || (x.p.name + " " + x.p.club + " " + (x.p.opponent || "")).toLowerCase().indexOf(q) >= 0;
      });
      if (!rows.length) { body.innerHTML = emptyP(q ? "Nobody in the squad matches “" + esc(squadQuery) + "”." : "No squad data yet."); return; }
      var html = "";
      ["GK", "DEF", "MID", "FWD"].forEach(function (pos) {
        var g = rows.filter(function (x) { return !x.owners[0].bench && x.p.pos === pos; });
        if (g.length) html += '<div class="grp">' + POSN[pos] + '</div>' + g.map(function (x) { return prowHtml(x, { team: true }); }).join("");
      });
      var b = rows.filter(function (x) { return x.owners[0].bench; });
      if (b.length) {
        html += '<div class="grp"><span>Bench</span><span>' + (t.benchPoints || 0) + ' pts</span></div>' +
          b.map(function (x) { return prowHtml(x, { team: true }); }).join("");
      }
      body.innerHTML = html;
      return;
    }

    // all four: who is playing, who is still to come, who scored most
    el("sidesearch").hidden = true;
    el("sideseg").hidden = false;
    var all = players(null).filter(function (x) { return x.owners.some(function (o) { return !o.bench; }); });
    var lists = {
      live: all.filter(function (x) { return x.p.state === "live"; })
        .sort(function (a, b) { return (b.p.points - a.p.points) || a.p.name.localeCompare(b.p.name); }),
      todo: all.filter(function (x) { return x.p.state === "upcoming"; })
        .sort(function (a, b) { return String(a.p.kickoff || "~").localeCompare(String(b.p.kickoff || "~")) || a.p.name.localeCompare(b.p.name); }),
      top: all.filter(function (x) { return x.p.state === "done" || x.p.state === "live"; })
        .sort(function (a, b) { return (b.p.points - a.p.points) || a.p.name.localeCompare(b.p.name); }).slice(0, 25)
    };
    var mode = sideMode || (lists.live.length ? "live" : (lists.todo.length ? "todo" : "top"));
    var titles = { live: "On the pitch", todo: "Still to play", top: "Top scorers" };
    el("sidetitle").textContent = titles[mode];
    el("sidemeta").textContent = "";
    el("sideseg").innerHTML = [["live", "Live"], ["todo", "To play"], ["top", "Top"]].map(function (m) {
      return '<button data-side="' + m[0] + '" aria-pressed="' + (mode === m[0]) + '">' + m[1] +
        '<span class="n">' + lists[m[0]].length + '</span></button>';
    }).join("");

    var rows = lists[mode];
    if (!rows.length) {
      var msg = {
        live: "Nobody from your squads is on the pitch right now.",
        todo: "Every starter has played this round.",
        top: "Nobody has played yet this round."
      }[mode];
      body.innerHTML = emptyP(msg);
      return;
    }
    if (mode === "todo") {
      var html2 = "", day = "";
      rows.forEach(function (x) {
        var d = x.p.kickoff ? dayLong(x.p.kickoff) : "Kickoff to be confirmed";
        if (d !== day) { html2 += '<div class="grp">' + esc(d) + '</div>'; day = d; }
        html2 += prowHtml(x, { team: false });
      });
      body.innerHTML = html2;
      return;
    }
    body.innerHTML = rows.map(function (x) { return prowHtml(x, { team: false }); }).join("");
  }

  /* ---------- ticker ---------- */

  function tickerRows(only) {
    return ((state && state.ticker) || []).filter(function (e) {
      return !only || (e.teams || []).some(function (t) { return t.team === only; });
    });
  }

  function tickerPanel(only) {
    var all = tickerRows(only);
    var unseen = all.filter(function (e) { return !seenSet[e.id]; });
    var rows = showSeen ? all : unseen;
    var swing = rows.reduce(function (a, e) { return a + (e.points || 0); }, 0);
    var now = Date.now();
    var body;

    if (!rows.length) {
      body = all.length
        ? emptyP("You are up to date. " + all.length + " event" + (all.length > 1 ? "s" : "") + " already seen.")
        : emptyP(only ? "Nothing has moved " + esc(only) + "&rsquo;s score yet this round."
                      : "No scoring events yet. Goals, assists, cards and bonus land here with what each is worth to you.");
    } else {
      body = '<div class="cols tk' + (only ? " solo" : "") + '"><span>Min</span><span>Player</span>' + (only ? "" : "<span></span>") +
        '<span class="num" style="font-weight:400">Pts</span><span></span></div>' +
        '<div class="scroll' + (rows.length > 7 ? " fade" : "") + '" data-keep="ticker">' +
        rows.map(function (e) {
          var fresh = !e.backfilled && (now - new Date(e.ts).getTime()) < 15 * 60 * 1000;
          var isSeen = !!seenSet[e.id];
          var pts = e.points == null
            ? '<span class="num unk" title="The Pro League feed prices no single events">?</span>'
            : '<span class="num ' + (e.points > 0 ? "plus" : (e.points < 0 ? "minus" : "")) + '">' + signed(e.points) + '</span>';
          var owners = (e.teams || []).map(function (o) {
            return { i: teamIndex(o.team), team: o.team, bench: o.bench, captain: o.multiplier > 1 };
          });
          var key = e.player ? findKeyByName(e.player, e.club) : "";
          var who = key ? findPlayer(key).p : { photo: e.photo, name: e.player };
          return '<div class="trow tk' + (only ? " solo" : "") + (fresh && !isSeen ? " recent" : "") + (isSeen ? " seen" : "") + '">' +
            '<span class="clock">' + (e.minute != null ? e.minute + "'" : "—") + '</span>' +
            '<button class="plink who"' + (key ? ' data-p="' + esc(key) + '"' : "") + '>' + face(who, "s") +
              '<span><b>' + esc(e.player) + '</b><em>' + esc(e.label) + (e.club ? " · " + esc(e.club) : "") + '</em></span></button>' +
            (only ? "" : ownersHtml(owners)) +
            pts +
            (isSeen ? '<span></span>' : '<button class="tick" data-seen="' + esc(e.id) + '" title="Mark as seen" aria-label="Mark as seen">' + icon("check") + '</button>') +
          '</div>';
        }).join("") + '</div>';
    }

    var foot = all.length !== unseen.length
      ? '<div class="sub-f"><button class="linkbtn" id="toggleseen">' + (showSeen ? "Only new events" : "Show " + (all.length - unseen.length) + " seen") + '</button></div>'
      : "";

    return '<div class="sub mint" id="tickerbox">' +
      '<div class="sub-h"><h3>Point ticker' + (unseen.length ? ' <button class="linkbtn" id="markseen">Mark all seen</button>' : "") + '</h3>' +
      '<span class="sum">' + (rows.length ? 'Sum<b>' + signed(swing) + ' pts</b>' : "") + '</span></div>' +
      body + foot + '</div>';
  }

  function findKeyByName(name, club) {
    var all = players(null);
    for (var i = 0; i < all.length; i++) {
      if (all[i].p.name === name && (!club || all[i].p.club === club)) return all[i].key;
    }
    return "";
  }

  /* ---------- results ---------- */

  function mineIn(m, game, onlyTeam) {
    return players(onlyTeam).filter(function (x) {
      return x.game === game && (x.p.club === m.home || x.p.club === m.away);
    });
  }

  function stackHtml(list) {
    if (!list.length) return '<span class="stack"></span>';
    var show = list.slice(0, 3);
    return '<span class="stack" title="' + esc(list.map(function (x) { return x.p.name; }).join(", ")) + '">' +
      show.map(function (x) { return face(x.p, "xs"); }).join("") +
      (list.length > 3 ? '<span class="more">+' + (list.length - 3) + '</span>' : "") + '</span>';
  }

  function fxRow(m, game, onlyTeam) {
    var playing = m.started && !m.finished;
    var clock = playing ? (m.minutes ? m.minutes + "'" : "live") : (m.finished ? "FT" : dayTime(m.kickoff));
    var score = m.homeGoals == null ? "v" : m.homeGoals + "–" + m.awayGoals;
    var mine = mineIn(m, game, onlyTeam);
    var id = game + ":" + m.home + ":" + m.away;

    var rows = [], partial = false;
    if (m.events) {
      rows = m.events.filter(function (e) { return e.kind === "goal" || e.kind === "assist" || e.kind === "own goal"; });
    } else {
      // the Pro League feed has no scorer list until it confirms the week, so
      // only players of yours can be accounted for
      partial = true;
      mineIn(m, game, null).forEach(function (x) {
        if (x.p.goals) rows.push({ kind: "goal", player: x.p.name, club: x.p.club, count: x.p.goals });
        if (x.p.assists) rows.push({ kind: "assist", player: x.p.name, club: x.p.club, count: x.p.assists });
      });
    }

    var head = '<summary class="trow fx' + (playing ? " playing" : "") + '">' +
      '<span class="club home"><span class="code-l">' + esc(m.home) + '</span>' + crest(m.homeBadge, m.home) + '</span>' +
      '<span class="sc' + (m.homeGoals == null ? " v" : "") + '">' + esc(score) + '</span>' +
      '<span class="club away">' + crest(m.awayBadge, m.away) + '<span class="code-l">' + esc(m.away) + '</span></span>' +
      '<span class="clock' + (playing ? " lv" : "") + '">' + esc(clock) + '</span>' +
      stackHtml(mine) + '</summary>';

    var body;
    if (rows.length) {
      body = '<div class="scorers">' + rows.map(function (e) {
        return '<div class="scorer">' + crest(e.club === m.home ? m.homeBadge : m.awayBadge, e.club) +
          '<b>' + esc(e.player) + '</b><span class="kind' + (e.kind === "goal" ? " goal" : "") + '">' + esc(e.kind) +
          (e.count > 1 ? " ×" + e.count : "") + '</span></div>';
      }).join("") +
      (partial ? '<p class="caveat">Only players from your squads. The full list lands once the Pro League confirms the week.</p>' : "") +
      (m.unattributed ? '<p class="caveat">' + m.unattributed + ' goal' + (m.unattributed > 1 ? "s" : "") + ' not attributed to a player by the feed.</p>' : "") +
      '</div>';
    } else if (partial && m.started) {
      body = '<div class="scorers"><p class="caveat">Scorers land once the Pro League confirms the week; nobody from your squads scored here.</p></div>';
    } else {
      body = '<div class="scorers"><p class="caveat">' + (m.started ? "No goals yet." : "Not kicked off.") +
        (mine.length ? " Yours: " + esc(mine.map(function (x) { return x.p.name; }).join(", ")) + "." : "") + '</p></div>';
    }
    var open = openFx[id] != null ? openFx[id] : playing;
    return '<details data-fx="' + esc(id) + '"' + (open ? " open" : "") + '>' + head + body + '</details>';
  }

  function resultsList(games, onlyTeam) {
    var html = "";
    games.forEach(function (g) {
      var block = g === "FPL" ? state.fpl : state.pro;
      var ms = (block && block.matches) || [];
      if (!ms.length) return;
      if (games.length > 1) html += '<div class="fxgrp">' + league(g) + ' · ' + roundName(g) + '</div>';
      html += ms.map(function (m) { return fxRow(m, g, onlyTeam); }).join("");
    });
    return html;
  }

  function upcomingOf(game) {
    var block = game === "FPL" ? (state && state.fpl) : (state && state.pro);
    if (!block) return { label: "", list: [] };
    if (block.upcoming && block.upcoming.length) {
      return { label: game === "FPL" ? "GW " + (block.next ? block.next.gw : "") : "week " + (block.next ? block.next.week : ""),
               list: block.upcoming };
    }
    return { label: roundName(game), list: (block.matches || []).filter(function (m) { return !m.started; }) };
  }

  function nextList(game, onlyTeam) {
    var u = upcomingOf(game);
    if (!u.list.length) return emptyP("No fixtures announced yet.");
    var html = "", day = "";
    u.list.forEach(function (m) {
      var d = m.kickoff ? dayLong(m.kickoff) : "Date to be confirmed";
      if (d !== day) { html += '<div class="dayh">' + esc(d) + '</div>'; day = d; }
      var mine = mineIn(m, game, onlyTeam);
      html += '<div class="trow nx">' +
        '<span class="clock">' + esc(hhmm(m.kickoff)) + '</span>' +
        '<span class="club home"><span class="code-l">' + esc(m.home) + '</span>' + crest(m.homeBadge, m.home) + '</span>' +
        '<span class="v">v</span>' +
        '<span class="club">' + crest(m.awayBadge, m.away) + '<span class="code-l">' + esc(m.away) + '</span></span>' +
        stackHtml(mine) + '</div>';
    });
    return '<div class="scroll' + (u.list.length > 8 ? " fade" : "") + '" data-keep="next-' + game + '">' + html + '</div>';
  }

  function resultsPanel(t) {
    var games = t ? [t.game] : ["FPL", "PRO"].filter(function (g) { return state && (g === "FPL" ? state.fpl : state.pro); });
    var onlyTeam = t ? sel : null;
    var block = t ? (t.game === "FPL" ? state.fpl : state.pro) : null;
    var hasNext = t && upcomingOf(t.game).list.length;
    var allDone = block && (block.matches || []).length && block.matches.every(function (m) { return m.finished; });
    var mode = !t ? "played" : (fxMode || (allDone && hasNext ? "next" : "played"));
    var toggle = t && hasNext
      ? '<span class="mini"><button data-fxmode="played" aria-pressed="' + (mode === "played") + '">Results</button>' +
        '<button data-fxmode="next" aria-pressed="' + (mode === "next") + '">Next round</button></span>'
      : "";

    var title = mode === "next" ? "Fixtures · " + upcomingOf(t.game).label : (t ? "Matches · " + roundName(t.game) : "Matches");
    var body;
    if (mode === "next") {
      body = nextList(t.game, onlyTeam);
    } else {
      var count = games.reduce(function (a, g) { return a + (((g === "FPL" ? state.fpl : state.pro) || {}).matches || []).length; }, 0);
      body = count
        ? '<div class="cols fx fxc"><span style="text-align:right">Home</span><span style="text-align:center">Score</span><span>Away</span><span></span><span class="mine" style="text-align:right">Yours</span></div>' +
          '<div class="scroll' + (count > 8 ? " fade" : "") + '" data-keep="results">' + resultsList(games, onlyTeam) + '</div>'
        : emptyP("No matches scheduled in this window.");
    }
    return '<div class="sub sky"><div class="sub-h"><h3>' + esc(title) + '</h3>' + toggle + '</div>' + body + '</div>';
  }

  /* ---------- transfers ---------- */

  function transferTable(list, side, kind) {
    if (!list.length) return emptyP("No transfers yet this season.");
    return '<div class="cols tf"><span>Player</span><span>Club</span><span class="gw">Round</span><span class="num" style="font-weight:400">Price</span></div>' +
      '<div class="scroll' + (list.length > 7 ? " fade" : "") + '" data-keep="tf-' + kind + '">' +
      list.map(function (x) {
        var p = x[side];
        var key = side === "in" ? findKeyByName(p.name, p.club) : "";
        return '<div class="trow tf">' +
          '<span class="who' + (key ? " plink" : "") + '"' + (key ? ' data-p="' + esc(key) + '" role="button" tabindex="0"' : "") + '>' +
            face(p, "s") + '<span><b>' + esc(p.name) + '</b><em>' + esc(p.pos) + '</em></span></span>' +
          '<span class="club">' + crest(p.badge, p.club) + esc(p.club) + '</span>' +
          '<span class="clock gw">' + (x.w ? (kind === "FPL" ? "GW " : "Wk ") + x.w : "–") + '</span>' +
          '<span class="num">' + money(p.price) + '</span></div>';
      }).join("") + '</div>';
  }

  function transfersView(t) {
    var list = t.transfers || [];
    var sumIn = list.reduce(function (a, x) { return a + (x["in"].price || 0); }, 0);
    var sumOut = list.reduce(function (a, x) { return a + (x.out.price || 0); }, 0);
    return '<div class="duo">' +
      '<div class="sub mint"><div class="sub-h"><h3>Transfers in</h3><span class="sum">Sum<b>' + money(sumIn) + '</b></span></div>' +
        transferTable(list, "in", t.game) + '</div>' +
      '<div class="sub sky"><div class="sub-h"><h3>Transfers out</h3><span class="sum">Sum<b>' + money(sumOut) + '</b></span></div>' +
        transferTable(list, "out", t.game) + '</div>' +
    '</div>';
  }

  /* ---------- pitch ---------- */

  function tokHtml(x) {
    var p = x.p, o = x.owners[0];
    var band = o.captain ? '<span class="arm">C</span>' : (o.vice ? '<span class="arm">V</span>' : "");
    var sub = p.state === "upcoming" ? (dayTime(p.kickoff) || p.opponent) : (p.state === "live" ? (p.matchMinute != null ? p.matchMinute + "'" : "live") + " · " + (p.score || "") : (p.opponent || ""));
    return '<button class="tok ' + esc(p.state) + '" data-p="' + esc(x.key) + '">' +
      '<span class="ring">' + face(p) + band + '<span class="pt">' + shown(Object.assign({}, p, { multiplier: o.multiplier })) + '</span></span>' +
      '<span class="tn">' + esc(p.name) + '</span><span class="to">' + esc(sub) + '</span></button>';
  }

  function pitchView(t) {
    var rows = players(sel);
    if (!rows.length) return emptyP("No squad data yet.");
    var starters = rows.filter(function (x) { return !x.owners[0].bench; });
    var bench = rows.filter(function (x) { return x.owners[0].bench; });
    var lines = ["GK", "DEF", "MID", "FWD"].map(function (pos) {
      var r = starters.filter(function (x) { return x.p.pos === pos; });
      return r.length ? '<div class="line">' + r.map(tokHtml).join("") + '</div>' : "";
    }).join("");
    return '<div class="pitch"><span class="half"></span><span class="box t"></span><span class="box b"></span>' + lines + '</div>' +
      (bench.length ? '<div class="benchrow"><span class="lbl">Bench · ' + (t.benchPoints || 0) + ' pts</span>' + bench.map(tokHtml).join("") + '</div>' : "");
  }

  function shape(t) {
    var s = (t.squad || []).filter(function (p) { return !p.bench; });
    return ["DEF", "MID", "FWD"].map(function (pos) { return s.filter(function (p) { return p.pos === pos; }).length; }).join("-");
  }

  /* ---------- charts ---------- */

  var CHARTS = {};

  function niceTicks(lo, hi, n) {
    if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
    var span = hi - lo, base = Math.pow(10, Math.floor(Math.log10(span / n)));
    var steps = [1, 2, 2.5, 5, 10, 20, 25, 50, 100], out = [];
    // the smallest round step that keeps the axis to n+1 labels or fewer
    for (var k = 0; k < steps.length; k++) {
      var step = steps[k] * base;
      var a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
      if ((b - a) / step <= n) {
        for (var v = a; v <= b + step / 2; v += step) out.push(Math.round(v * 1e6) / 1e6);
        return out;
      }
    }
    return [lo, hi];
  }

  function chartBox(id, title, spec, extra) {
    CHARTS[id] = spec;
    var legend = spec.series.length > 1
      ? '<div class="legend">' + spec.series.map(function (s) {
          return '<span><i class="' + (s.dash ? "dash" : "") + '" style="--k:' + s.color + '"></i>' + esc(s.name) + '</span>';
        }).join("") + '</div>'
      : "";
    return '<div class="chartbox"><div class="chart-h"><h3>' + esc(title) + '</h3>' + (extra || "") + legend + '</div>' +
      (spec.note ? '<div class="chart-h"><span class="note">' + esc(spec.note) + '</span></div>' : "") +
      '<div class="chart" data-chart="' + id + '" tabindex="0" role="img" aria-label="' + esc(spec.aria || title) + '"></div></div>';
  }

  function cssVar(v) {
    var m = /var\((--[^)]+)\)/.exec(v);
    return m ? getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim() || v : v;
  }

  function drawChart(node) {
    var spec = CHARTS[node.dataset.chart];
    if (!spec) return;
    var W = Math.max(240, node.clientWidth), H = spec.height || 210;
    var xs = [];
    spec.series.forEach(function (s) { s.values.forEach(function (v) { if (v.y != null && xs.indexOf(v.x) < 0) xs.push(v.x); }); });
    xs.sort(function (a, b) { return a - b; });
    if (!xs.length) { node.innerHTML = '<p class="chart-empty">' + esc(spec.empty || "No history yet.") + '</p>'; return; }

    var ys = [];
    spec.series.forEach(function (s) { s.values.forEach(function (v) { if (v.y != null) ys.push(v.y); }); });
    var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    if (spec.zero) lo = Math.min(0, lo);
    var ticks = niceTicks(lo, hi, 4);
    lo = ticks[0]; hi = ticks[ticks.length - 1];
    var fmt = spec.fmt || num;

    var m = { l: 44, r: 46, t: 12, b: 26 };
    var pw = W - m.l - m.r, ph = H - m.t - m.b;
    var x0 = xs[0], x1 = xs[xs.length - 1];
    var X = function (x) { return x1 === x0 ? m.l + pw / 2 : m.l + (x - x0) / (x1 - x0) * pw; };
    var Y = function (y) {
      var f = (y - lo) / (hi - lo || 1);
      return spec.invert ? m.t + f * ph : m.t + ph - f * ph;
    };

    var every = Math.max(1, Math.ceil(xs.length / Math.max(2, Math.floor(pw / 46))));
    var svg = '<svg width="' + W + '" height="' + H + '" aria-hidden="true">';
    xs.forEach(function (x, i) {
      svg += '<line class="grid" x1="' + X(x) + '" x2="' + X(x) + '" y1="' + m.t + '" y2="' + (m.t + ph) + '"/>';
      if (i % every === 0 || i === xs.length - 1) {
        svg += '<text class="ax" x="' + X(x) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(spec.xLabel(x)) + '</text>';
      }
    });
    ticks.forEach(function (t) {
      svg += '<text class="ax" x="' + (m.l - 10) + '" y="' + (Y(t) + 4) + '" text-anchor="end">' + esc(spec.tickFmt ? spec.tickFmt(t) : brief(t)) + '</text>';
    });

    var ends = [];
    spec.series.forEach(function (s) {
      var d = "", pts = s.values.filter(function (v) { return v.y != null; });
      s.values.forEach(function (v, i) {
        if (v.y == null) { return; }
        var prev = i > 0 ? s.values[i - 1] : null;
        d += (d && prev && prev.y != null ? "L" : "M") + X(v.x).toFixed(1) + " " + Y(v.y).toFixed(1);
      });
      svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2"' + (s.dash ? ' stroke-dasharray="4 4"' : "") +
        ' stroke-linejoin="round" stroke-linecap="round"/>';
      if (!s.dash && pts.length <= 40) {
        pts.forEach(function (v) {
          svg += '<circle cx="' + X(v.x) + '" cy="' + Y(v.y) + '" r="3.5" fill="' + s.color + '" stroke="var(--chart)" stroke-width="2"/>';
        });
      }
      if (!s.dash && pts.length) {
        var last = pts[pts.length - 1];
        ends.push({ y: Y(last.y), x: X(last.x), text: spec.endFmt ? spec.endFmt(last.y) : fmt(last.y), color: s.color });
      }
    });

    // direct labels at the line ends, nudged apart so they never overlap
    ends.sort(function (a, b) { return a.y - b.y; });
    for (var i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 15) ends[i].y = ends[i - 1].y + 15;
    ends.forEach(function (e) {
      svg += '<text class="end" x="' + (e.x + 9) + '" y="' + (e.y + 4) + '">' + esc(e.text) + '</text>';
    });

    svg += '<line class="xh" id="' + node.dataset.chart + '-xh" x1="0" x2="0" y1="' + m.t + '" y2="' + (m.t + ph) + '" style="display:none"/>';
    svg += '<g id="' + node.dataset.chart + '-dots"></g>';
    svg += '<rect x="' + m.l + '" y="0" width="' + pw + '" height="' + H + '" fill="transparent" class="hit"/></svg>';
    node.innerHTML = svg + '<div class="ctip"></div>';

    var tipEl = node.querySelector(".ctip"), xh = node.querySelector(".xh"), dots = node.querySelector("g");

    function show(idx) {
      if (idx < 0 || idx >= xs.length) return;
      node.dataset.idx = idx;
      var x = xs[idx], px = X(x);
      xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.style.display = "";
      tipEl.textContent = "";
      var hd = document.createElement("div"); hd.className = "hd"; hd.textContent = spec.tipLabel(x); tipEl.appendChild(hd);
      var dotHtml = "";
      spec.series.forEach(function (s) {
        var v = s.values.filter(function (q) { return q.x === x; })[0];
        if (!v || v.y == null) return;
        dotHtml += '<circle cx="' + px + '" cy="' + Y(v.y) + '" r="5.5" fill="' + s.color + '" stroke="var(--chart)" stroke-width="2.5"/>';
        var r = document.createElement("div"); r.className = "r";
        var k = document.createElement("i"); k.style.background = cssVar(s.color); r.appendChild(k);
        var b = document.createElement("b"); b.textContent = fmt(v.y); r.appendChild(b);
        var n = document.createElement("span"); n.textContent = s.name; r.appendChild(n);
        tipEl.appendChild(r);
      });
      dots.innerHTML = dotHtml;
      tipEl.style.display = "block";
      var tw = tipEl.offsetWidth;
      var left = Math.min(Math.max(px - tw / 2, 0), W - tw);
      tipEl.style.transform = "translate(" + left + "px," + (-tipEl.offsetHeight - 6) + "px)";
    }

    function hide() { xh.style.display = "none"; dots.innerHTML = ""; tipEl.style.display = "none"; }

    function nearest(clientX) {
      var r = node.getBoundingClientRect(), px = clientX - r.left, best = 0, bd = Infinity;
      xs.forEach(function (x, i) { var d = Math.abs(X(x) - px); if (d < bd) { bd = d; best = i; } });
      return best;
    }

    node.onpointermove = function (e) { show(nearest(e.clientX)); };
    node.onpointerleave = function () { if (document.activeElement !== node) hide(); };
    node.onfocus = function () { show(xs.length - 1); };
    node.onblur = hide;
    node.onkeydown = function (e) {
      var i = Number(node.dataset.idx || xs.length - 1);
      if (e.key === "ArrowLeft") { show(Math.max(0, i - 1)); e.preventDefault(); }
      if (e.key === "ArrowRight") { show(Math.min(xs.length - 1, i + 1)); e.preventDefault(); }
    };
  }

  var ro = window.ResizeObserver ? new ResizeObserver(function (entries) {
    entries.forEach(function (en) {
      var n = en.target;
      if (Math.abs((n._w || 0) - n.clientWidth) > 2) { n._w = n.clientWidth; drawChart(n); }
    });
  }) : null;

  function drawCharts() {
    if (ro) ro.disconnect();
    document.querySelectorAll(".chart[data-chart]").forEach(function (n) {
      n._w = n.clientWidth;
      drawChart(n);
      if (ro) ro.observe(n);
    });
  }

  function teamCharts(t) {
    var hist = t.history || [];
    var rnd = function (x) { return (t.game === "FPL" ? "GW " : "Wk ") + x; };
    var color = tc(sel);
    var series = [{ name: t.name, color: color, values: hist.map(function (r) { return { x: r.w, y: r.pts }; }) }];
    var avgs = t.game === "FPL" && state.fpl && state.fpl.averages;
    if (avgs) {
      series.push({ name: "FPL average", color: "var(--ink-3)", dash: true,
        values: hist.map(function (r) { return { x: r.w, y: avgs[String(r.w)] != null ? avgs[String(r.w)] : null }; }) });
    }
    var pointsChart = chartBox("pts-" + sel, "Points per round", {
      series: series, zero: true, xLabel: rnd, tipLabel: function (x) { return t.game === "FPL" ? "Gameweek " + x : "Week " + x; },
      fmt: function (v) { return num(v) + " pts"; }, endFmt: function (v) { return String(v); }, tickFmt: function (v) { return String(v); },
      empty: "The first round's points will chart here.", aria: "Points per round for " + t.name
    });

    var overall = hist.filter(function (r) { return r.overall; });
    var mode = rankMode || (overall.length >= 2 ? "overall" : "week");
    var field = mode === "overall" ? "overall" : "rank";
    var rankChart = chartBox("rank-" + sel, mode === "overall" ? "Overall rank" : "Round rank", {
      series: [{ name: mode === "overall" ? "Overall rank" : "Round rank", color: color,
                 values: hist.map(function (r) { return { x: r.w, y: r[field] || null }; }) }],
      invert: true, xLabel: rnd, tipLabel: function (x) { return t.game === "FPL" ? "Gameweek " + x : "Week " + x; },
      fmt: num, endFmt: brief, tickFmt: function (v) { return brief(v).replace(/\.0+(?=[Mk])/, "").replace(/(\.\d*?)0+(?=[Mk])/, "$1"); },
      note: mode === "overall" && t.game === "PRO" && overall.length < hist.length
        ? "The Pro League keeps no rank history; this one is recorded from week " + (overall[0] ? overall[0].w : "") + " on." : "",
      empty: "No rank history yet.", aria: "Rank per round for " + t.name + ", higher on the chart is better"
    }, '<span class="mini"><button data-rank="overall" aria-pressed="' + (mode === "overall") + '">Overall</button>' +
       '<button data-rank="week" aria-pressed="' + (mode === "week") + '">Round</button></span>');

    return '<div class="charts">' + pointsChart + rankChart + '</div>';
  }

  function overviewChart(teams) {
    var series = teams.map(function (t, i) {
      return { name: t.name, color: tc(i), values: (t.history || []).map(function (r) { return { x: r.w, y: r.pts }; }) };
    });
    return '<div class="charts one">' + chartBox("all-pts", "Points per round, all four teams", {
      series: series, zero: true, height: 230,
      xLabel: function (x) { return "Rd " + x; }, tipLabel: function (x) { return "Round " + x + " (FPL GW / Pro League week)"; },
      fmt: function (v) { return num(v) + " pts"; }, endFmt: function (v) { return String(v); }, tickFmt: function (v) { return String(v); },
      note: "FPL gameweeks and Pro League weeks, by round number. The two games score differently.",
      aria: "Points per round for all four teams"
    }) + '</div>';
  }

  /* ---------- main panel ---------- */

  function renderMain(teams) {
    var t = sel == null ? null : teams[sel];
    var tabs = t ? [["round", "This round"], ["pitch", "Pitch"], ["transfers", "Transfers"]]
                 : [["round", "This round"], ["next", "Next round"]];
    if (!tabs.some(function (x) { return x[0] === tab; })) tab = "round";

    el("tabs").innerHTML = tabs.map(function (x) {
      return '<button class="ptab" role="tab" data-tab="' + x[0] + '" aria-selected="' + (tab === x[0]) + '">' + x[1] + '</button>';
    }).join("");

    CHARTS = {};
    var meta = "", body = "";

    if (t && t.unavailable) {
      body = emptyP("Fantasy Pro League needs a signed-in session before it will hand over " + esc(t.name) + "&rsquo;s points.");
    } else if (tab === "round") {
      var only = t ? t.name : null;
      var evs = tickerRows(only);
      meta = icon("pulse") + '<span>' + evs.length + ' event' + (evs.length === 1 ? "" : "s") + '</span>';
      body = '<div class="duo">' + tickerPanel(only) + resultsPanel(t) + '</div>' + (t ? teamCharts(t) : overviewChart(teams));
    } else if (tab === "pitch") {
      meta = icon("shirt") + '<span>' + esc(shape(t)) + '</span>';
      body = pitchView(t);
    } else if (tab === "transfers") {
      var list = t.transfers || [];
      var net = list.reduce(function (a, x) { return a + (x["in"].price || 0) - (x.out.price || 0); }, 0);
      meta = icon("swap") + '<span>' + list.length + ' transfer' + (list.length === 1 ? "" : "s") + ' · net ' +
        (net >= 0 ? "+" : "−") + money(Math.abs(net)) + '</span>';
      body = transfersView(t);
    } else if (tab === "next") {
      var f = upcomingOf("FPL"), p = upcomingOf("PRO");
      body = '<div class="duo">' +
        '<div class="sub mint"><div class="sub-h"><h3>Premier League · ' + esc(f.label) + '</h3></div>' + nextList("FPL", null) + '</div>' +
        '<div class="sub sky"><div class="sub-h"><h3>Pro League · ' + esc(p.label) + '</h3></div>' + nextList("PRO", null) + '</div></div>';
      var d = nextDeadline(null);
      meta = d ? icon("clock") + '<span>' + esc(d.label) + ' ' + esc(until(d.at)) + '</span>' : "";
    }
    el("tabmeta").innerHTML = meta;
    el("pbody").innerHTML = body;
  }

  /* ---------- player drawer ---------- */

  function renderDrawer() {
    var box = el("drawer"), scrim = el("scrim");
    var x = drawerKey ? findPlayer(drawerKey) : null;
    if (!x) { box.hidden = true; scrim.hidden = true; return; }
    var p = x.p;
    var drivers = (p.drivers || []).filter(function (d) { return d.points; });
    var status = p.state === "live" ? "Playing · " + (p.matchMinute != null ? p.matchMinute + "'" : "live")
      : p.state === "done" ? (p.minutes ? p.minutes + " minutes played" : "Did not play") : (p.kickoff ? "Kicks off " + dayTime(p.kickoff) : "Yet to play");

    box.innerHTML = '<button class="ib x" id="dclose" aria-label="Close">' + icon("x") + '</button>' +
      '<div class="d-top">' + face(p) + '<div><h2>' + esc(p.name) + '</h2><p>' +
        esc({ GK: "Goalkeeper", DEF: "Defender", MID: "Midfielder", FWD: "Forward" }[p.pos] || p.pos) + ' · ' + esc(p.club) + ' · ' + league(x.game) + '</p></div></div>' +
      '<div class="d-score"><div class="big">' + (p.points || 0) + '<small style="text-align:left">points · ' + esc(roundName(x.game)) + '</small></div>' +
        '<div class="m"><b>' + esc((p.opponent || "") + (p.score ? " · " + p.score : "")) + '</b>' + esc(status) + '</div></div>' +
      '<div class="evs">' + eventChips(p) + '</div>' +
      '<div class="d-sec"><h3>Where the points came from</h3>' +
        (drivers.length ? drivers.map(function (d) {
          return '<div class="drow"><span>' + esc(d.label) + '</span><b class="' + (d.points > 0 ? "plus" : "minus") + '">' + signed(d.points) + '</b></div>';
        }).join("") : '<p class="empty">' + (p.state === "upcoming" ? "Nothing yet. The match has not started." : "No breakdown in this reading.") + '</p>') +
        (x.game === "FPL" && p.bps ? '<div class="drow"><span>Bonus points system score</span><b>' + p.bps + '</b></div>' : "") +
      '</div>' +
      '<div class="d-sec"><h3>In your teams</h3>' + x.owners.map(function (o) {
        var role = o.captain ? "Captain" + (o.multiplier > 2 ? " (triple)" : "") : (o.vice ? "Vice-captain" : (o.bench ? "On the bench" : "Starting"));
        var worth = o.bench ? 0 : (p.points || 0) * (o.multiplier || 1);
        return '<div class="drow"><span style="display:flex;gap:8px;align-items:center"><span class="mono" style="--tc:' + tc(o.i) +
          ';width:22px;height:22px;font-size:9px">' + esc(initials(o.team)) + '</span>' + esc(o.team) + ' · <span class="muted">' + role + '</span></span><b>' + worth + ' pts</b></div>';
      }).join("") + '</div>';
    box.hidden = false;
    scrim.hidden = false;
  }

  function openPlayer(key) {
    drawerKey = key;
    renderDrawer();
    var c = el("dclose");
    if (c) c.focus();
  }

  function closeDrawer() {
    drawerKey = null;
    renderDrawer();
  }

  /* ---------- search ---------- */

  function renderResults() {
    var q = el("q").value.trim().toLowerCase();
    var box = el("results");
    if (!q) { box.hidden = true; return; }
    var hits = players(null).filter(function (x) {
      return (x.p.name + " " + x.p.club).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 8);
    box.innerHTML = hits.length
      ? hits.map(function (x) { return prowHtml(x, { team: false }); }).join("")
      : '<p class="none">No player called “' + esc(el("q").value) + '” in your squads.</p>';
    box.hidden = false;
  }

  /* ---------- render ---------- */

  function render() {
    var teams = allTeams(state);
    if (sel != null && !teams[sel]) sel = null;

    var keep = {};
    document.querySelectorAll("[data-keep]").forEach(function (n) { keep[n.dataset.keep] = n.scrollTop; });

    renderRail(teams);
    renderHero(teams);
    renderStats(teams);
    renderCards(teams);
    renderSide(teams);
    renderMain(teams);
    drawCharts();
    renderDrawer();
    if (!el("results").hidden) renderResults();

    document.querySelectorAll("[data-keep]").forEach(function (n) {
      if (keep[n.dataset.keep]) n.scrollTop = keep[n.dataset.keep];
    });

    var unseen = tickerRows(null).filter(function (e) { return !seenSet[e.id]; }).length;
    var bc = el("bellcount");
    bc.hidden = !unseen;
    bc.textContent = unseen > 99 ? "99+" : unseen;
    el("bell").setAttribute("aria-label", unseen ? unseen + " new point events" : "Point events");

    tick();
  }

  function tick() {
    var s = state;
    var box = el("status");
    var stale = s && s.updatedAt && (Date.now() - new Date(s.updatedAt).getTime()) > 4 * 60 * 1000;
    var live = s && s.live && !stale;
    box.className = "status" + (live ? " is-live" : "");
    el("statustext").innerHTML = !s ? "No data yet"
      : (live ? "<b>Live</b> · updated " : "Updated ") + esc(ago(s.updatedAt));
    el("foot").textContent = s && s.updatedAt
      ? "Points refresh every minute while matches are on · last reading " + dayTime(s.updatedAt)
      : "Waiting for the first reading";
  }

  /* ---------- selection, routed through the URL hash so back works ---------- */

  function fromHash() {
    var h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    var teams = allTeams(state), found = null;
    teams.forEach(function (t, i) { if (slug(t) === h) found = i; });
    return found;
  }

  function choose(i) {
    var teams = allTeams(state);
    var target = i == null || i === "" ? "" : slug(teams[Number(i)]);
    if (("#" + target) === location.hash || (!target && !location.hash)) { applyHash(); return; }
    if (target) location.hash = target;
    else history.pushState("", document.title, location.pathname + location.search);
    applyHash();
  }

  function applyHash() {
    var next = fromHash();
    if (next !== sel) { sel = next; tab = "round"; fxMode = null; rankMode = null; squadQuery = ""; el("sq").value = ""; }
    var m = el("menu"); if (m) m.hidden = true;
    render();
    window.scrollTo({ top: 0 });
  }

  window.addEventListener("hashchange", applyHash);
  window.addEventListener("popstate", applyHash);

  /* ---------- theme ---------- */

  var THEMES = ["auto", "light", "dark"];
  var theme = store("fmd.theme") || "auto";

  function applyTheme() {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    el("themebtn").innerHTML = icon(theme === "dark" ? "moon" : (theme === "light" ? "sun" : "auto"));
    el("themebtn").title = "Theme: " + theme + " (click to change)";
  }

  el("themebtn").addEventListener("click", function () {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % 3];
    store("fmd.theme", theme === "auto" ? null : theme);
    applyTheme();
    drawCharts();
  });

  /* ---------- events ---------- */

  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-team]"))) { choose(t.dataset.team); return; }
    if ((t = e.target.closest("#pick"))) { var m = el("menu"); m.hidden = !m.hidden; e.stopPropagation(); return; }
    if ((t = e.target.closest("[data-tab]"))) { tab = t.dataset.tab; render(); return; }
    if ((t = e.target.closest("[data-side]"))) { sideMode = t.dataset.side; render(); return; }
    if ((t = e.target.closest("[data-fxmode]"))) { fxMode = t.dataset.fxmode; render(); return; }
    if ((t = e.target.closest("[data-rank]"))) { rankMode = t.dataset.rank; render(); return; }
    if ((t = e.target.closest("[data-seen]"))) { markSeen([t.dataset.seen]); return; }
    if ((t = e.target.closest("#markseen"))) { markSeen(tickerRows(sel == null ? null : allTeams(state)[sel].name).map(function (x) { return x.id; })); return; }
    if ((t = e.target.closest("#toggleseen"))) { showSeen = !showSeen; render(); return; }
    if ((t = e.target.closest("[data-p]"))) {
      el("results").hidden = true;
      openPlayer(t.dataset.p);
      return;
    }
    if (e.target.closest("#dclose") || e.target === el("scrim")) { closeDrawer(); return; }
    if (e.target.closest("#bell")) {
      tab = "round"; showSeen = false; render();
      var box = el("tickerbox");
      if (box) box.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    var menu = el("menu");
    if (menu && !menu.hidden && !e.target.closest(".menu")) menu.hidden = true;
    if (!e.target.closest(".search")) el("results").hidden = true;
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (drawerKey) closeDrawer();
      el("results").hidden = true;
      var m = el("menu"); if (m) m.hidden = true;
    }
    if (e.key === "/" && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) {
      e.preventDefault();
      el("q").focus();
    }
    if (e.key === "Enter" && e.target.matches && e.target.matches('[role="button"][data-p]')) openPlayer(e.target.dataset.p);
  });

  /* remember which match accordions are open, so a refresh does not snap them shut */
  document.addEventListener("toggle", function (e) {
    var d = e.target;
    if (d && d.dataset && d.dataset.fx) openFx[d.dataset.fx] = d.open;
  }, true);

  el("q").addEventListener("input", renderResults);
  el("q").addEventListener("focus", renderResults);
  el("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var first = el("results").querySelector("[data-p]");
      if (first) { el("results").hidden = true; openPlayer(first.dataset.p); }
    }
  });

  el("sq").addEventListener("input", function () { squadQuery = el("sq").value; renderSide(allTeams(state)); });

  applyTheme();
  sel = fromHash();
  render();
  setInterval(tick, 1000);
  setInterval(function () { renderStats(allTeams(state)); }, 60000);

  /* live updates: a published data file when the page is hosted, the artifact
     database when it runs as an artifact. Whichever is there wins. */
  var fromFeed = false;   // has a live reading replaced the one baked in at build time

  function accept(next, feed) {
    if (!next || !next.updatedAt) return;
    // The reading baked in at build time can carry a newer stamp than the feed
    // (the CDN serving it runs a minute or so behind), so it must never block a
    // live reading — only feed-against-feed comparisons guard ordering.
    if (feed ? (fromFeed && next.updatedAt < state.updatedAt)
             : (state && state.updatedAt && next.updatedAt < state.updatedAt)) return;
    if (feed) fromFeed = true;
    var first = !state;
    state = next;
    if (first) sel = fromHash();
    render();
  }

  if (DATA_URL) {
    var pull = function () {
      fetch(DATA_URL + (DATA_URL.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (next) { accept(next, true); })
        .catch(function () { /* keep showing the last good reading */ });
    };
    pull();
    setInterval(pull, 30000);
  }

  (async function () {
    var db = await window.claude?.use?.("db");
    if (!db) return;
    db.doc("live/state").onSnapshot(function (snap) {
      if (snap.exists) accept(snap.data(), true);
    }, function () { /* keep showing the last good reading */ });
  })();
</script>
