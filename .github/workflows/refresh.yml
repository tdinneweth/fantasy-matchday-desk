name: Refresh points

# GitHub drops most runs of a scheduled workflow: on Friday 9 October a 5-minute
# cron fired twice between 10:00 and 22:00 and neither landed during a match.
# So the schedule only has to start a run once in a while; the run then keeps
# itself going. It reads every minute while a match is on, waits through the
# gaps between kickoffs (overnight too, when the round carries on the next
# day), and exits only when no kickoff is due within thirty hours. Before the
# six-hour job limit it starts its own successor. The schedule runs every day,
# since rounds are sometimes midweek; a run with nothing coming exits at once.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: pro-stat-dump
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start a successor run before this one hits the job time limit

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Dump Pro League stat records
        env:
          PROLEAGUE_TOKEN: ${{ secrets.PROLEAGUE_TOKEN }}
        run: python3 dump_pro_stats.py
